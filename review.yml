  - date: '2026-07-28'
    rating: 4
    summary: >-
      ZotGPT is a genuine first-party API provider, not a vendor reseller. UC
      Irvine's Office of Information Technology built and operates the platform
      itself, and every documentation surface resolved live. The developer story
      is unusually well told for a university: two API generations, a written
      three-phase deprecation plan with before-and-after migration code, client
      setup guides for Claude Desktop, VS Code and opencode, a documented
      provider-alias routing convention, and a credit-and-budget access model
      tiered by campus affiliation. The multi-cloud claim is externally
      verifiable rather than marketing — Chat, ClassChat, and Creator each
      terminate on their own UC Irvine-owned AWS Application Load Balancer in
      us-west-2 under *.aws.uci.edu with Amazon-issued certificates, while the
      first-generation API's control plane runs on Azure API Management in West
      US 2. Every human surface sits behind Shibboleth SAML SSO, verified as a
      live 302 to the campus IdP. What is missing is the machine-readable layer:
      no OpenAPI is retrievable anonymously from any host, the Azure API
      Management developer portal gates its definitions behind sign-in, the
      documented data-plane hosts do not resolve in public DNS, and the entire
      /.well-known/ discovery surface is empty — no security.txt, no llms.txt,
      no API catalog, no agent card, not even robots.txt. Two OpenAPIs in this
      repo are marked generated and were built strictly from base URLs, headers,
      provider aliases, model slugs, and operations UCI names verbatim in its own
      documentation; no endpoint was invented and no live call is claimed.
