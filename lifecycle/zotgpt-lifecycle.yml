provider: ZotGPT (UC Irvine)
providerId: zotgpt
description: >-
  ZotGPT has done something most API providers never manage: it published a
  real, phased, written deprecation plan for its first-generation API before
  switching it off, with a named replacement, a code-level migration guide
  showing before-and-after, and an explicit statement that old keys stop working.
  That is a stronger operational posture than most commercial API providers in
  this catalog.
tags:
  - Lifecycle
  - Deprecation
  - Migration
  - Versioning
versioning:
  scheme: path
  current: /v1
  notes: >-
    Both generations expose /v1. UCI states that in the migration "model names
    and request structures remain unchanged" — the break is the host and the
    credential, not the contract shape.
deprecation:
  policy_published: true
  policy_url: https://zotgpt.uci.edu/services/migrate-azure-api/
  deprecated_api: ZotGPT API (Azure-managed)
  deprecated_base_urls:
    - https://api.zotgpt.uci.edu/v1
    - https://api.azureapi.zotgpt.uci.edu/v1
  replacement: ZotGPT Gateway
  replacement_base_url: https://api.portkey.ai/v1
  phases:
    - phase: 1
      window: Days 1–30
      detail: New signups frozen; existing users notified.
    - phase: 2
      window: Months 1–3
      detail: Self-migration period with support available.
    - phase: 3
      window: End of month 3
      detail: '"All remaining Azure API keys disabled."'
  migration_guide:
    before: |
      client = OpenAI(
          api_key="YOUR_AZURE_API_KEY",
          base_url="https://api.azureapi.zotgpt.uci.edu/v1"
      )
    after: |
      client = OpenAI(
          api_key="YOUR_VIRTUAL_KEY",
          base_url="https://app.portkey.ai/v1"
      )
    notes: >-
      The service page for clients documents https://api.portkey.ai/v1 as the
      OpenAI-compatible base URL and https://api.portkey.ai for Anthropic-style
      clients; the migration page quotes https://app.portkey.ai/v1. Both appear
      in UCI's own documentation and are recorded here as published, without
      being reconciled on UCI's behalf.
  gain: >-
    Migrating trades a single-vendor gpt-4o deployment for "Gemini, Claude, and
    more" through the same request shape.
