aid: zotgpt
name: ZotGPT (UC Irvine)
description: >-
  ZotGPT is the University of California, Irvine's institutionally-operated
  generative AI platform, built and run in-house by the UCI Office of
  Information Technology AI Team rather than purchased as a vendor seat.
  Launched to faculty and staff in early 2024 and to students in April 2024,
  it now spans four end-user products (Chat, ClassChat, Creator, Prompt
  Library), a training arm (Academy), and two generations of developer API.
  The platform is deliberately multi-cloud and multi-model: the interactive
  applications run on UC Irvine's own AWS accounts in us-west-2 behind
  Shibboleth SSO, the first-generation developer API was fronted by Azure API
  Management, and models are sourced across OpenAI, Anthropic (via AWS
  Bedrock), Google, Azure, and open-source options such as Mistral and
  DeepSeek. The deprecated Azure-managed API at api.zotgpt.uci.edu is being
  retired in favor of the ZotGPT Gateway, a Portkey-specification unified AI
  gateway that gives the campus one endpoint, virtual API keys, per-key spend
  limits, and provider-agnostic model routing. Data is held under UC Irvine's
  P3 protection standard, retained 12 months, and contractually excluded from
  vendor model training.
