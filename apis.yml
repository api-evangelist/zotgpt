      method: docs-read + host-probe
      docs: >-
        https://zotgpt.uci.edu/services/gateway/ and
        https://zotgpt.uci.edu/services/gateway/clients/ document the base URLs
        (https://api.portkey.ai for Anthropic-style clients,
        https://api.portkey.ai/v1 for OpenAI-compatible clients), the virtual
