apis:
  - aid: zotgpt:gateway
    name: ZotGPT Gateway
    description: >-
      The ZotGPT Gateway is UC Irvine's unified AI API gateway and the
      designated successor to the deprecated Azure-managed API. It exposes "a
      growing catalog of AI models from a single endpoint" spanning OpenAI,
      Anthropic on AWS Bedrock, Google, and Azure, and it leverages the Portkey
      API specification so existing OpenAI- or Anthropic-shaped client code
      migrates "with just a few changes and a new API key." Access is through
      UCInetID sign-in at the gateway portal, where a user mints virtual API
      keys scoped to a workspace with per-key budget enforcement. Documented
      surfaces are chat completions, embeddings, and streaming responses.
      Provider routing is selected with an `x-portkey-provider` header carrying
      a UCI provider alias such as `@zotgpt-api-bedrock` or `@openai-prod`, and
      the model slug comes from the campus Model Catalog.
    humanURL: https://zotgpt.uci.edu/services/gateway/
    baseURL: https://api.portkey.ai/v1
    tags: [ AI Gateway, LLM, Chat Completions, Embeddings, Model Routing, Multi-Model ]
    properties:
