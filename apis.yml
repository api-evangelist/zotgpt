    docs: >-
      https://zotgpt.uci.edu/services/api/ names the endpoint https://api.zotgpt.uci.edu/v1/chat/completions,
      bearer-token auth, the gpt-4o model, the $200 credit, and the ServiceNow request path. https://zotgpt.uci.edu/services/migrate-azure-api/
      quotes the old base URL https://api.azureapi.zotgpt.uci.edu/v1 alongside Python client code.
    endpoint_check: >-
      api.zotgpt.uci.edu and api.azureapi.zotgpt.uci.edu do NOT resolve in public DNS (NXDOMAIN, curl
      exit 6) — the data plane is reachable only from inside the campus network or is already withdrawn
      as part of the deprecation. The control plane IS public: the Azure API Management developer portal
      at https://portal.azureapi.zotgpt.uci.edu returns HTTP 200 titled "UC Irvine API Management" with
      /apis and /products routes, and resolves through oit-apim-usw2.azure-api.net. The underlying APIM
      gateway oit-apim-usw2.azure-api.net answers with an APIM JSON envelope ({"statusCode":404,"message":"Resource
      not found"}), confirming a live Azure API Management instance. No OpenAPI was retrievable anonymously
      — the portal gates specs behind sign-in.
