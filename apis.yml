- aid: zotgpt:api
  name: ZotGPT API (Deprecated)
  description: >-
    The first-generation ZotGPT developer API, an OpenAI-compatible chat completions endpoint fronted
    by Azure API Management and available to UCI faculty and staff with "$200 in initial API credits to
    get started." Documented as a bearer-token POST to https://api.zotgpt.uci.edu/v1/chat/completions
    serving gpt-4o. Access was requested through a ServiceNow knowledge article and keys were managed
    in the Azure API Management developer portal at portal.azureapi.zotgpt.uci.edu. UCI has published
    a three-phase deprecation: new signups frozen, a three-month self-migration window, and then "all
    remaining Azure API keys disabled." Superseded by the ZotGPT Gateway.
  humanURL: https://zotgpt.uci.edu/services/api/
