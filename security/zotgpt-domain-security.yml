identity_plane:
  idp: https://shib.service.uci.edu/idp/profile/SAML2/Redirect/SSO
  metadata: https://shib.service.uci.edu/idp/shibboleth
  metadata_status: 200
  metadata_content_type: application/xml
  protocol: SAML 2.0 (Shibboleth)
  notes: >-
    The IdP publishes its SAML metadata anonymously — the only machine-readable
    descriptor anywhere in the ZotGPT estate that a third party can retrieve
    without credentials.
email_domain_security:
  domain: uci.edu
  spf: 'v=spf1 include:%{ir}.%{v}.%{d}.spf.has.pphosted.com ?all'
  spf_notes: >-
