  dmarc: 'v=DMARC1; p=none; fo=1; rua=mailto:dmarc_rua@emaildefense.proofpoint.com; ruf=mailto:dmarc_ruf@emaildefense.proofpoint.com'
  dmarc_policy: none
  dmarc_notes: Monitoring only; no quarantine or reject enforcement.
  dnssec: not enabled (no DS record for uci.edu)
  caa: no CAA record published for uci.edu
findings:
  - severity: informational
    finding: >-
      Multi-cloud is real and externally verifiable — AWS us-west-2 for every
      application plane, Azure West US 2 for the API management plane.
  - severity: informational
    finding: >-
      Product isolation is real — Chat, ClassChat, and Creator each run in their
      own named AWS production environment behind their own load balancer.
  - severity: low
    finding: >-
      No security.txt at /.well-known/security.txt on any ZotGPT host (404).
  - severity: low
    finding: >-
      No robots.txt on zotgpt.uci.edu (404), and no sitemap.xml.
  - severity: low
    finding: >-
      uci.edu publishes no CAA record and no DS record (DNSSEC not enabled), and
      DMARC is at p=none.
  - severity: informational
    finding: >-
      Internal AWS account and environment names (zot-gpt-prod,
